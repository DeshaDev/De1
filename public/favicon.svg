<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fav-page-left" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="fav-page-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="fav-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="fav-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Golden Foundation Arc (Smile) -->
  <path d="M14 51 C22 58, 42 58, 50 51" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />

  <!-- Soaring Book Wings -->
  <g filter="url(#fav-shadow)">
    <path d="M32 45 C22 36, 12 38, 7 46 C10 30, 21 19, 32 23 Z" fill="url(#fav-page-left)" />
    <path d="M32 45 C42 36, 52 38, 57 46 C54 30, 43 19, 32 23 Z" fill="url(#fav-page-right)" />
    <path d="M32 23 V45" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Radiant Golden Star of Knowledge -->
  <path d="M32 3 C33 10, 36 13, 43 14 C36 15, 33 18, 32 25 C31 18, 28 15, 21 14 C28 13, 31 10, 32 3 Z" fill="url(#fav-star)" />
  <circle cx="32" cy="14" r="2.5" fill="#FFFBEB" />
</svg>
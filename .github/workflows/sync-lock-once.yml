name: Sync Azure Speech dependency lockfile once

on:
  push:
    branches:
      - fix/azure-audio-pronunciation

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: fix/azure-audio-pronunciation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit the lockfile and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/sync-lock-once.yml
          git commit -m "Sync package lock for Azure Speech SDK"
          git push origin HEAD:fix/azure-audio-pronunciation

name: Desca Clinical CI & Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-and-build:
    name: Typecheck, Unit Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run TypeScript static analysis (lint)
        run: npm run lint

      - name: Run unit tests (Eye-Tracking, Clinical Metrics, Dyscalculia PAE & Security)
        run: npm test

      - name: Build production bundle
        run: npm run build

name: Baseera Product CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-and-build:
    name: Typecheck, Unit Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: Run TypeScript static analysis (lint)
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      # Run HTTP integration tests against the built dist/ directory so SPA
      # fallback regressions cannot be hidden by the test-before-build order.
      - name: Run unit and HTTP integration tests
        run: npm test

      - name: Verify production server bundle exists
        run: test -s server.js

      - name: Smoke-test production server
        run: node scripts/production-smoke-test.mjs

      - name: Run browser end-to-end smoke tests
        run: npm run e2e

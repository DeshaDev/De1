name: Desca Clinical CI & Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-and-build:
    name: Typecheck, Unit Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript static analysis (lint)
        run: npm run lint

      - name: Run unit tests (Eye-Tracking, Clinical Metrics & Dyslexia Engines)
        run: npx tsx --test src/utils/eyeTrackerEngine.test.ts src/utils/clinicalMetrics.test.ts src/utils/dyslexiaEngines.test.ts

      - name: Build production bundle
        run: npm run build
